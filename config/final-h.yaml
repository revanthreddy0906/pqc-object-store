# Revision batch H: queueing. Closed loop gives the state-dependent service rate mu(n);
# open loop gives response time against offered load. Odd-numbered rates (1st, 3rd, ...) are
# the training set and even-numbered rates the held-out set for the load-dependent model
# (pre-registered, SoT v1.8). Capacity is measured in this batch (closed loop, 128-256 workers).
# ML-KEM only: batches A-D showed every mode shares this workload's capacity and knee.
experiment_id: final-h
bucket: pqc-bench
chunk_size: 4194304
part_size: 8388608
warmup_s: 5
duration_s: 20
settle_max_s: 40         # upper bound; the pause ends when the server's write-back is quiet
pool_bytes: 67108864
repetitions: 5
get_objects: 32
seed: 20261015
blocks:
  - sizes: [1024, 65536]
    concurrency: [1, 2, 4, 8, 16, 32, 64, 128, 256]
    operations: [put]
    modes: [P1]
  - loop: open
    sizes: [1024, 65536]
    rates: [1500, 2000, 2500, 3000, 3300, 3600, 3900, 4200, 4500, 4800, 5200, 5600]
    threads: 256
    operations: [put]
    modes: [P1]
