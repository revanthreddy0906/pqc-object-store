# Audit batch K: the two under-powered primary cells of batch E/EK with 50 repetitions
# (SoT v1.11). At the paired log-ratio SDs observed in E/EK (0.08 and 0.11), about 50 pairs
# give one TOST at +-5% a power of 0.8.
experiment_id: final-k
bucket: pqc-bench
chunk_size: 4194304
part_size: 8388608
warmup_s: 5
duration_s: 20
settle_max_s: 40         # upper bound; the pause ends when the server's write-back is quiet
pool_bytes: 67108864
repetitions: 50
get_objects: 32
seed: 20261019
blocks:
  - sizes: [65536]
    concurrency: [32, 128]
    operations: [put]
    modes: [B2, P1]
