# Development only. Final measurements run MinIO on a dedicated Linux VM (SoT §10).
services:
  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    image: pqc-minio:RELEASE.2025-10-15T17-29-55Z
    container_name: pqc-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      # Server-side resource sampling scrapes /minio/v2/metrics/node (SoT §8.3).
      # Public only because the port is bound to 127.0.0.1; use a bearer token on shared hosts.
      MINIO_PROMETHEUS_AUTH_TYPE: public
      # Purge deleted objects every 30 s (default 5 min): benchmarks write and delete GBs per
      # minute, and the default let 12 GB of deleted data pile up and fill the host disk.
      MINIO_API_DELETE_CLEANUP_INTERVAL: 30s
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  minio-data:
