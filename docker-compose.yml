# Development only. Final measurements run MinIO on a dedicated Linux VM (SoT §10).
services:
  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    image: pqc-minio:RELEASE.2025-10-15T17-29-55Z
    container_name: pqc-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  minio-data:
